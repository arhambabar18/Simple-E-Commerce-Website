<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bazaar - Online Shop</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>Bazaar</h1>
    <form id="search-form">
      <input type="search" id="search" placeholder="Search products">
      <button>Search</button>
    </form>
    <nav>
      <a href="#">Sign in</a>
      <a href="#" id="cart">Cart (0)</a>
    </nav>
  </header>

  <nav>
    <a href="#">Electronics</a>
    <a href="#">Fashion</a>
    <a href="#">Home</a>
    <a href="#">Handmade</a>
    <a href="#">Books</a>
    <a href="#contact">Contact</a>
  </nav>

  <main>
    <section class="hero">
      <h2 id="hero-text">Big season sale. Up to 50% off.</h2>
      <p id="greeting"></p>
    </section>

    <section>
      <h2>Popular products</h2>
      <select id="category"><option>All</option></select>
      <p id="delivery"></p>
      <div class="grid" id="grid"></div>
    </section>
  </main>

  <footer id="contact">
    <p>Contact us: support@bazaar.com | +92 300 1234567</p>
    <form id="newsletter">
      <input id="email" placeholder="Your email for offers">
      <button>Subscribe</button>
    </form>
    <p id="message"></p>
    <p>© <span id="year"></span> Bazaar. All rights reserved.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
